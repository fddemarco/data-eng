models:
  - name: stg_jaffle_shop__orders
    latest_version: 1
    config:
      materialized: table
      contract: {enforced: true}
      access: protected
    columns:
      - name: order_id
        data_type: int
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: int
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        data_type: date
      - name: amount
        data_type: int
      - name: status
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
    versions:
      - v: 1
        deprecation_date: '2026-12-31'
      - v: 2
        columns:
          - exclude:
            - status
          - name: status_description
            data_type: string
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
