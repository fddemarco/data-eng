[project]
name = "loader"
version = "0.1.0"
description = "dlt Primer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dlt[duckdb,sql-database]>=1.30.0",
    "marimo>=0.24.2",
    "polars[async,numpy,pyarrow]>=1.44.2",
    "pymysql>=1.2.3",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.marimo.runtime]
dotenv = [".env"]
